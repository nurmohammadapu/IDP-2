<body>

        <main class="main-content">
            <header class="main-header">
            <h1>Appointment Management</h1>
            <div class="header-actions">
                <input type="text" id="searchAppointments" placeholder="🔍 Search appointments..." class="search-input">
                <button id="addAppointmentBtn" class="btn btn-primary">Book Appointment</button>
            </div>
            </header>

            <div class="content-section">
                <div class="table-container">
                    <table id="appointmentsTable">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Patient</th>
                                <th>Doctor</th>
                                <th>Date</th>
                                <th>Time</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td colspan="7" class="loading">Loading appointments...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Appointment Modal -->
    <div id="appointmentModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
        <h2 id="modalTitle">Book Appointment</h2>
        <span class="close">&times;</span>
        </div>
        <form id="appointmentForm">
        <div class="form-row">
            <div class="form-group">
            <label for="patientSearchInput">Patient *</label>
            <div class="searchable-select" id="patientSelectContainer">
                <input type="text" id="patientSearchInput" placeholder="Search Patient by Name, ID or Phone..." autocomplete="off" required />
                <div class="options-list" id="patientOptions"></div>
            </div>
            <input type="hidden" name="patient_id" id="patient_id" />
            <div id="newPatientCheckboxContainer" style="margin-top: 10px;">
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" id="isNewPatient" />
                    <span>New Patient?</span>
                </label>
            </div>
            </div>
            <div class="form-group">
            <label for="doctorSearchInput">Doctor *</label>
            <div class="searchable-select" id="doctorSelectContainer">
                <input type="text" id="doctorSearchInput" placeholder="Search Doctor..." autocomplete="off" required />
                <div class="options-list" id="doctorOptions"></div>
            </div>
            <input type="hidden" name="doctor_id" id="doctor_id" required />
            </div>
        </div>

        <!-- New Patient Fields (Initially Hidden) -->
        <div id="newPatientFields" style="display: none; background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #eee;">
            <h3 style="margin-top: 0; font-size: 1.1rem; margin-bottom: 15px;">New Patient Details</h3>
            <div class="form-row">
                <div class="form-group">
                    <label for="newPatientName">Full Name *</label>
                    <input type="text" id="newPatientName" placeholder="Patient Name">
                </div>
                <div class="form-group">
                    <label for="newPatientAge">Age *</label>
                    <input type="number" id="newPatientAge" placeholder="Age">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="newPatientGender">Gender *</label>
                    <select id="newPatientGender">
                        <option value="">Select Gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="newPatientContact">Contact Number *</label>
                    <input type="tel" id="newPatientContact" placeholder="Phone Number">
                </div>
            </div>
            <div class="form-group">
                <label for="newPatientAddress">Address *</label>
                <textarea id="newPatientAddress" rows="2" placeholder="Patient Address"></textarea>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
            <label for="appointmentDate">Date *</label>
            <input type="date" id="appointmentDate" name="appointment_date" required>
            </div>
            <div class="form-group">
            <label for="appointmentTime">Time Slot *</label>
            <select id="appointmentTime" name="appointment_time" required>
                <option value="">Select doctor & date first...</option>
            </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="appointmentStatus">Status</label>
                <select id="appointmentStatus" name="status">
                <option value="pending">Pending</option>
                <option value="confirmed">Confirmed</option>
                <option value="cancelled">Cancelled</option>
                </select>
            </div>
            <div class="form-group" id="visitFeeGroup">
                <label for="visitFeeCollected">Visit Fee Collection (৳)</label>
                <input type="number" id="visitFeeCollected" name="visit_fee" min="0" step="10" placeholder="e.g. 500">
            </div>
        </div>

        <div class="form-group">
            <label for="appointmentNotes">Notes</label>
            <textarea id="appointmentNotes" name="notes" rows="3"></textarea>
        </div>

        <div class="form-actions">
            <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Appointment</button>
        </div>
        </form>
    </div>
    </div>
    <div id="toast" class="toast"></div>

    <script src="scripts.js"></script>

    <script>
    let currentAppointmentId = null;
    let appointments = [];
    let patients = [];
    let doctors = [];

    // Debounce utility function
    function debounce(fn, delay) {
        let timeoutId;
        return function(...args) {
            clearTimeout(timeoutId);
            timeoutId = setTimeout(() => fn.apply(this, args), delay);
        };
    }


    // Fetch search results from API and display options
    async function fetchAndShowOptions(apiUrl, query, inputEl, optionsDiv, hiddenInput, onSelectCallback) {
        if (!query || query.length < 2) {
            optionsDiv.style.display = 'none';
            hiddenInput.value = ''; // clear selection if query too short
            return;
        }

        try {
            const res = await fetch(`${apiUrl}?search=${encodeURIComponent(query)}`);
            if (!res.ok) throw new Error('Failed to fetch');
            const data = await res.json();

            optionsDiv.innerHTML = '';
            if (data.length === 0) {
                optionsDiv.innerHTML = '<div class="option-item">No results found</div>';
            } else {
                data.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'option-item';
                    const isPatient = apiUrl.includes('patients');
                    if (isPatient) {
                        div.textContent = `${item.name} (ID: ${item.id}, Phone: ${item.contact})`;
                    } else {
                        div.textContent = `${item.name} - ${item.specialty} (UID: ${item.unique_id || item.id}, Phone: ${item.contact})`;
                    }
                    div.addEventListener('click', () => {
                        if (isPatient) {
                            inputEl.value = item.name;
                        } else {
                            inputEl.value = item.name + (item.specialty ? ` - ${item.specialty}` : '');
                        }
                        hiddenInput.value = item.id;
                        optionsDiv.style.display = 'none';
                        if (onSelectCallback) onSelectCallback(item);
                    });
                    optionsDiv.appendChild(div);
                });
            }
            optionsDiv.style.display = 'block';
        } catch (error) {
            optionsDiv.innerHTML = '<div class="option-item">Error loading data</div>';
            optionsDiv.style.display = 'block';
        }
    }

    // Load all appointments from backend
    async function loadAppointments() {
        try {
            const response = await fetch('/api/appointments');
            const data = await response.json();

            if (response.ok) {
                appointments = data.sort((a, b) => b.id - a.id);
                displayAppointments(appointments);
            } else {
                showToast('Failed to load appointments', 'error');
            }
        } catch (error) {
            showToast('Network error loading appointments', 'error');
        }
    }

    // Load initial dropdown data (patients and doctors)
    async function loadDropdownData() {
        try {
            const [patientsResponse, doctorsResponse] = await Promise.all([
                fetch('/api/patients'),
                fetch('/api/doctors')
            ]);

            if (patientsResponse.ok && doctorsResponse.ok) {
                patients = await patientsResponse.json();
                doctors = await doctorsResponse.json();
                // Optional: populateDropdowns();
            } else {
                showToast('Failed to load dropdown data', 'error');
            }
        } catch (error) {
            showToast('Network error loading dropdown data', 'error');
        }
    }

    // Display appointments in the table
    function displayAppointments(appointmentsData) {
        const tbody = document.querySelector('#appointmentsTable tbody');
        tbody.innerHTML = '';

        if (appointmentsData.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="no-data">No appointments found</td></tr>';
            return;
        }

        appointmentsData.forEach(appointment => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${appointment.id}</td>
                <td>${appointment.patient_name}</td>
                <td>${appointment.doctor_name}</td>
                <td>${formatDate(appointment.appointment_date)}</td>
                <td>${formatTime12(appointment.appointment_time)}</td>
                <td><span class="status status-${appointment.status}">${appointment.status}</span></td>
                <td>
                    <button class="btn btn-sm btn-secondary" onclick="editAppointment(${appointment.id})">Edit</button>
                    <button class="btn btn-sm btn-danger" onclick="deleteAppointment(${appointment.id})">Delete</button>
                </td>
            `;
            tbody.appendChild(row);
        });
    }

    // Open modal to add a new appointment
    window.addAppointment = function() {
        currentAppointmentId = null;
        document.getElementById('modalTitle').textContent = 'Book Appointment';
        document.getElementById('appointmentForm').reset();

        document.getElementById('patientSearchInput').value = '';
        document.getElementById('patientSearchInput').disabled = false;
        document.getElementById('patientSearchInput').required = true;
        document.getElementById('patient_id').value = '';

        document.getElementById('isNewPatient').checked = false;
        document.getElementById('newPatientFields').style.display = 'none';
        document.getElementById('newPatientCheckboxContainer').style.display = 'block';

        document.getElementById('doctorSearchInput').value = '';
        document.getElementById('doctor_id').value = '';

        document.getElementById('appointmentStatus').value = 'pending';
        document.getElementById('visitFeeCollected').value = '';

        const today = new Date().toISOString().split('T')[0];
        document.getElementById('appointmentDate').min = today;

        document.getElementById('appointmentModal').style.display = 'block';
    };

    // Open modal to edit an existing appointment
    window.editAppointment = function(id) {
        const appointment = appointments.find(a => a.id === id);
        if (!appointment) return;

        currentAppointmentId = id;
        document.getElementById('modalTitle').textContent = 'Edit Appointment';
        document.getElementById('appointmentForm').reset();

        document.getElementById('patientSearchInput').value = appointment.patient_name;
        document.getElementById('patientSearchInput').disabled = false;
        document.getElementById('patient_id').value = appointment.patient_id;

        document.getElementById('isNewPatient').checked = false;
        document.getElementById('newPatientFields').style.display = 'none';
        document.getElementById('newPatientCheckboxContainer').style.display = 'none'; // Hide "New Patient" option during edit

        document.getElementById('doctorSearchInput').value = appointment.doctor_name + (appointment.doctor_specialty ? ` - ${appointment.doctor_specialty}` : '');
        document.getElementById('doctor_id').value = appointment.doctor_id;

        document.getElementById('appointmentDate').value = appointment.appointment_date;
        if (typeof updateAvailableSlots === 'function') {
            updateAvailableSlots(appointment.appointment_time);
        }
        document.getElementById('appointmentStatus').value = appointment.status;
        document.getElementById('appointmentNotes').value = appointment.notes || '';
        document.getElementById('appointmentModal').style.display = 'block';
    };

    // Delete appointment by id
    async function deleteAppointment(id) {
        if (!confirm('Are you sure you want to delete this appointment?')) return;

        try {
            const response = await fetch(`/api/appointments/${id}`, {
                method: 'DELETE'
            });

            const data = await response.json();

            if (response.ok) {
                showToast('Appointment deleted successfully', 'success');
                loadAppointments();
            } else {
                showToast(data.error || 'Failed to delete appointment', 'error');
            }
        } catch (error) {
            showToast('Network error deleting appointment', 'error');
        }
    }

    // Save (create or update) appointment
    async function saveAppointment(formData) {
        const isNewPatient = document.getElementById('isNewPatient').checked;
        
        if (!isNewPatient && !formData.patient_id) {
            showToast('Please select valid Patient from the list or check "New Patient"', 'error');
            return;
        }

        if (!formData.doctor_id) {
            showToast('Please select a valid Doctor from the list', 'error');
            return;
        }

        let payload = { ...formData };

        if (isNewPatient) {
            const newPatientData = {
                name: document.getElementById('newPatientName').value,
                age: document.getElementById('newPatientAge').value,
                gender: document.getElementById('newPatientGender').value,
                contact: document.getElementById('newPatientContact').value,
                address: document.getElementById('newPatientAddress').value
            };

            if (!newPatientData.name || !newPatientData.age || !newPatientData.gender || !newPatientData.contact || !newPatientData.address) {
                showToast('Please fill all new patient fields', 'error');
                return;
            }
            payload.new_patient = newPatientData;
            delete payload.patient_id;
        }

        const url = currentAppointmentId ? `/api/appointments/${currentAppointmentId}` : '/api/appointments';
        const method = currentAppointmentId ? 'PUT' : 'POST';

        try {
            const response = await fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (response.ok) {
                showToast(currentAppointmentId ? 'Appointment updated successfully' : 'Appointment booked successfully', 'success');
                document.getElementById('appointmentModal').style.display = 'none';
                loadAppointments();
                // If new patient was added, you might want to refresh patients list if needed elsewhere
            } else {
                showToast(data.error || 'Failed to save appointment', 'error');
            }
        } catch (error) {
            showToast('Network error saving appointment', 'error');
        }
    }

    // Filter appointments table on search input
    document.getElementById('searchAppointments').addEventListener('input', function () {
        const searchTerm = this.value.toLowerCase();
        const filtered = appointments.filter(app =>
            app.patient_name.toLowerCase().includes(searchTerm) ||
            app.doctor_name.toLowerCase().includes(searchTerm) ||
            formatDate(app.appointment_date).toLowerCase().includes(searchTerm) ||
            app.status.toLowerCase().includes(searchTerm)
        );
        displayAppointments(filtered);
    });

    document.addEventListener('DOMContentLoaded', () => {
        checkAuthAndLoadUser();
        loadAppointments();
        loadDropdownData();

        // Add appointment button
        document.getElementById('addAppointmentBtn').addEventListener('click', addAppointment);

        // Modal close buttons
        document.querySelector('.close').addEventListener('click', () => {
            document.getElementById('appointmentModal').style.display = 'none';
        });

        document.getElementById('cancelBtn').addEventListener('click', () => {
            document.getElementById('appointmentModal').style.display = 'none';
        });

        // Form submit
        document.getElementById('appointmentForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const appointmentData = Object.fromEntries(formData);
            saveAppointment(appointmentData);
        });

        // Close modal if clicked outside modal content
        window.addEventListener('click', (e) => {
            if (e.target === document.getElementById('appointmentModal')) {
                document.getElementById('appointmentModal').style.display = 'none';
            }
        });

        // New Patient Checkbox Toggle
        const isNewPatientCheckbox = document.getElementById('isNewPatient');
        const newPatientFields = document.getElementById('newPatientFields');
        const patientSearchInput = document.getElementById('patientSearchInput');
        const patientHidden = document.getElementById('patient_id');

        isNewPatientCheckbox.addEventListener('change', function() {
            if (this.checked) {
                newPatientFields.style.display = 'block';
                patientSearchInput.disabled = true;
                patientSearchInput.required = false;
                patientSearchInput.value = '';
                patientHidden.value = '';
            } else {
                newPatientFields.style.display = 'none';
                patientSearchInput.disabled = false;
                patientSearchInput.required = true;
            }
        });

        // Setup patient search inputs
        const patientOptions = document.getElementById('patientOptions');

        // Setup doctor search inputs
        const doctorInput = document.getElementById('doctorSearchInput');
        const doctorOptions = document.getElementById('doctorOptions');
        const doctorHidden = document.getElementById('doctor_id');
        const appointmentDate = document.getElementById('appointmentDate');
        const appointmentTimeSelect = document.getElementById('appointmentTime');

        // Function to fetch available slots based on selected doctor & date
        window.updateAvailableSlots = async function(selectedTime = null) {
            const doctorId = doctorHidden.value;
            const date = appointmentDate.value;

            if (!doctorId || !date) {
                appointmentTimeSelect.innerHTML = '<option value="">Select doctor & date first...</option>';
                return;
            }

            appointmentTimeSelect.innerHTML = '<option value="">Loading slots...</option>';

            try {
                const response = await fetch(`/api/appointments/slots?doctor_id=${doctorId}&date=${date}`);
                const slots = await response.json();

                if (response.ok) {
                    appointmentTimeSelect.innerHTML = '<option value="">Select time slot...</option>';
                    slots.forEach(slot => {
                        const opt = document.createElement('option');
                        opt.value = slot.time;
                        if (slot.isBooked && slot.time !== selectedTime) {
                            opt.textContent = `${slot.display} - [Booked]`;
                            opt.disabled = true;
                        } else {
                            opt.textContent = `${slot.display} - [Serial #${slot.serial}]`;
                        }
                        if (slot.time === selectedTime) {
                            opt.selected = true;
                        }
                        appointmentTimeSelect.appendChild(opt);
                    });
                } else {
                    appointmentTimeSelect.innerHTML = '<option value="">Error loading slots</option>';
                    showToast(slots.error || 'Failed to load slots', 'error');
                }
            } catch (error) {
                appointmentTimeSelect.innerHTML = '<option value="">Error loading slots</option>';
                showToast('Network error loading slots', 'error');
            }
        };

        appointmentDate.addEventListener('change', () => window.updateAvailableSlots());

        // Debounced patient search
        const debouncedPatientSearch = debounce(() => {
            fetchAndShowOptions('/api/patients', patientSearchInput.value.trim(), patientSearchInput, patientOptions, patientHidden);
        }, 300);

        // Debounced doctor search
        const debouncedDoctorSearch = debounce((query) => {
            fetchAndShowOptions('/api/doctors', query, doctorInput, doctorOptions, doctorHidden, (selectedDoctor) => {
                if (selectedDoctor && selectedDoctor.visit_fee) {
                    document.getElementById('visitFeeCollected').value = selectedDoctor.visit_fee;
                }
                updateAvailableSlots();
            });
        }, 300);

        // Patient input event
        patientSearchInput.addEventListener('input', () => {
            patientHidden.value = '';
            debouncedPatientSearch();
        });

        // Doctor input event
        doctorInput.addEventListener('input', () => {
            doctorHidden.value = '';
            appointmentTimeSelect.innerHTML = '<option value="">Select doctor & date first...</option>';
            const query = doctorInput.value.trim();
            debouncedDoctorSearch(query);
        });

        // Hide dropdown options if clicked outside
        document.addEventListener('click', (e) => {
            if (!document.getElementById('patientSelectContainer').contains(e.target)) {
                patientOptions.style.display = 'none';
            }
            if (!document.getElementById('doctorSelectContainer').contains(e.target)) {
                doctorOptions.style.display = 'none';
            }
        });
    });
</script>

            try {
                const response = await fetch(`/api/appointments/${id}`, {
                    method: 'DELETE'

            const url = currentAppointmentId ? `/api/appointments/${currentAppointmentId}` : '/api/appointments';

            try {
                const response = await fetch(url, {
