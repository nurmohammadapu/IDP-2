<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Appointments - Hospital Management System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <nav class="sidebar">
            <div class="sidebar-header">
                <h2>🏥 HMS</h2>
                <p class="user-role">Patient Portal</p>
            </div>
            <ul class="sidebar-menu">
                <li><a href="patient-dashboard.html">📊 Dashboard</a></li>
                <li><a href="patient-appointments.html" class="active">📅 My Appointments</a></li>
                <li><a href="patient-bills.html">💰 My Bills</a></li>
                <li><a href="settings.html">👤 My Profile</a></li>
            </ul>
            <div class="sidebar-footer">
                <div class="user-info">
                    <span id="userName">Loading...</span>
                    <small id="userEmail">Loading...</small>
                </div>
                <button id="logoutBtn" class="btn btn-secondary">Logout</button>
            </div>
        </nav>

        <main class="main-content">
            <header class="main-header">
                <h1>My Appointments</h1>
                <div class="header-actions">
                    <button id="bookAppointmentBtn" class="btn btn-primary">Book New Appointment</button>
                </div>
            </header>

            <div class="content-section">
                <div class="table-container">
                    <table id="appointmentsTable">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Serial #</th>
                                <th>Time</th>
                                <th>Doctor</th>
                                <th>Specialty</th>
                                <th>Notes / Symptom</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td colspan="7" class="loading">Loading appointments...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Book Appointment Modal -->
    <div id="appointmentModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Book New Appointment</h2>
                <span class="close">&times;</span>
            </div>
            <form id="appointmentForm">
                <div class="form-group">
                    <label for="doctorSelect">Select Doctor *</label>
                    <select id="doctorSelect" name="doctor_id" required>
                        <option value="">Choose a doctor...</option>
                    </select>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="appointmentDate">Preferred Date *</label>
                        <input type="date" id="appointmentDate" name="appointment_date" required>
                    </div>
                    <div class="form-group">
                        <label for="appointmentTime">Preferred Time *</label>
                        <select id="appointmentTime" name="appointment_time" required>
                            <option value="">Select doctor & date first...</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="appointmentNotes">Reason for Visit</label>
                    <textarea id="appointmentNotes" name="notes" rows="3" placeholder="Describe your symptoms or reason for the appointment..."></textarea>
                </div>
                
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Book Appointment</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="scripts.js"></script>
    <script>
        let currentUser = null;
        let doctors = [];

        async function loadAppointments() {
            try {
                const response = await fetch('/api/patients/dashboard');
                const data = await response.json();
                
                if (response.ok) {
                    displayAppointments(data.appointments || []);
                } else {
                    showToast('Failed to load appointments', 'error');
                }
            } catch (error) {
                showToast('Network error loading appointments', 'error');
            }
        }

        function formatTime12(time24) {
            if (!time24) return '-';
            const [hStr, mStr] = time24.split(':');
            let h = parseInt(hStr, 10);
            const ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12;
            if (h === 0) h = 12;
            return `${String(h).padStart(2, '0')}:${mStr} ${ampm}`;
        }

        function displayAppointments(appointments) {
            const tbody = document.querySelector('#appointmentsTable tbody');
            tbody.innerHTML = '';
            
            if (appointments.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="no-data">No appointments found</td></tr>';
                return;
            }
            
            appointments.forEach(appointment => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${formatDate(appointment.appointment_date)}</td>
                    <td>${appointment.serial_number ? `#${appointment.serial_number}` : '-'}</td>
                    <td>${formatTime12(appointment.appointment_time)}</td>
                    <td>${appointment.doctor_name}</td>
                    <td>${appointment.doctor_specialty}</td>
                    <td>${appointment.notes || '-'}</td>
                    <td><span class="status status-${appointment.status}">${appointment.status}</span></td>
                    <td>
                        ${appointment.status === 'pending' ? 
                            `<button class="btn btn-sm btn-danger" onclick="cancelAppointment(${appointment.id})">Cancel</button>` : 
                            '-'
                        }
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        async function loadDoctors() {
            try {
                const response = await fetch('/api/doctors');
                const data = await response.json();
                if (response.ok) {
                    doctors = data;
                    const select = document.getElementById('doctorSelect');
                    select.innerHTML = '<option value="">Choose a doctor...</option>';
                    doctors.forEach(d => {
                        const opt = document.createElement('option');
                        opt.value = d.id;
                        let displayName = d.name;
                        if (!displayName.toLowerCase().startsWith('dr')) {
                            displayName = `Dr. ${displayName}`;
                        }
                        opt.textContent = `${displayName} - ${d.specialty}`;
                        select.appendChild(opt);
                    });
                }
            } catch (error) {
                console.error(error);
            }
        }

        async function cancelAppointment(appointmentId) {
            if (!confirm('Are you sure you want to cancel this appointment?')) return;
            
            try {
                const response = await fetch(`/api/appointments/${appointmentId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ status: 'cancelled' })
                });
                
                if (response.ok) {
                    showToast('Appointment cancelled successfully', 'success');
                    loadAppointments();
                } else {
                    showToast('Failed to cancel appointment', 'error');
                }
            } catch (error) {
                showToast('Network error', 'error');
            }
        }

        // Inheriting global checkAuthAndLoadUser from scripts.js

        document.addEventListener('DOMContentLoaded', () => {
            checkAuthAndLoadUser();
            loadAppointments();
            loadDoctors();
            
            const doctorSelect = document.getElementById('doctorSelect');
            const appointmentDate = document.getElementById('appointmentDate');
            const appointmentTime = document.getElementById('appointmentTime');

            async function updateAvailableSlots() {
                const doctorId = doctorSelect.value;
                const date = appointmentDate.value;

                if (!doctorId || !date) {
                    appointmentTime.innerHTML = '<option value="">Select doctor & date first...</option>';
                    return;
                }

                appointmentTime.innerHTML = '<option value="">Loading slots...</option>';

                try {
                    const response = await fetch(`/api/appointments/slots?doctor_id=${doctorId}&date=${date}`);
                    const slots = await response.json();

                    if (response.ok) {
                        appointmentTime.innerHTML = '<option value="">Select time...</option>';
                        slots.forEach(slot => {
                            const opt = document.createElement('option');
                            opt.value = slot.time;
                            if (slot.isBooked) {
                                opt.textContent = `${slot.display} - [Booked]`;
                                opt.disabled = true;
                            } else {
                                opt.textContent = `${slot.display} - [Serial #${slot.serial}]`;
                            }
                            appointmentTime.appendChild(opt);
                        });
                    } else {
                        appointmentTime.innerHTML = '<option value="">Error loading slots</option>';
                        showToast(slots.error || 'Failed to load slots', 'error');
                    }
                } catch (error) {
                    appointmentTime.innerHTML = '<option value="">Error loading slots</option>';
                    showToast('Network error loading slots', 'error');
                }
            }

            doctorSelect.addEventListener('change', updateAvailableSlots);
            appointmentDate.addEventListener('change', updateAvailableSlots);
            
            document.getElementById('bookAppointmentBtn').addEventListener('click', () => {
                document.getElementById('appointmentDate').min = new Date().toISOString().split('T')[0];
                document.getElementById('appointmentTime').innerHTML = '<option value="">Select doctor & date first...</option>';
                document.getElementById('appointmentModal').style.display = 'block';
            });
            
            document.querySelector('.close').addEventListener('click', () => {
                document.getElementById('appointmentModal').style.display = 'none';
            });
            
            document.getElementById('cancelBtn').addEventListener('click', () => {
                document.getElementById('appointmentModal').style.display = 'none';
            });
            
            document.getElementById('appointmentForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const appointmentData = Object.fromEntries(formData);
                
                try {
                    const response = await fetch('/api/appointments', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(appointmentData)
                    });
                    
                    if (response.ok) {
                        showToast('Appointment booked successfully!', 'success');
                        document.getElementById('appointmentModal').style.display = 'none';
                        loadAppointments();
                    } else {
                        const data = await response.json();
                        showToast(data.error || 'Failed to book appointment', 'error');
                    }
                } catch (error) {
                    showToast('Network error', 'error');
                }
            });
        });
    </script>
</body>
</html>
