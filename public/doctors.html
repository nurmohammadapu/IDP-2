<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctors - Hospital Management System</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <nav class="sidebar">
            <div class="sidebar-header">
                <h2>🏥 HMS</h2>
            </div>
            <ul class="sidebar-menu">
                <li><a href="dashboard.html">📊 Dashboard</a></li>
                <li><a href="users.html">🔑 User Management</a></li>
                <li><a href="patients.html">👥 Patients</a></li>
                <li><a href="doctors.html" class="active">👨‍⚕️ Doctors</a></li>
                <li><a href="appointments.html">📅 Appointments</a></li>
                <li><a href="billing.html">💰 Billing</a></li>
                <li><a href="reports.html">📈 Reports</a></li>
                <li><a href="settings.html">⚙️ Settings</a></li>
            </ul>
            <div class="sidebar-footer">
                <button id="logoutBtn" class="btn btn-secondary">Logout</button>
            </div>
        </nav>

        <main class="main-content">
            <header class="main-header">
                <h1>Doctor Management</h1>
                <div class="header-actions">
                    <input type="text" id="searchDoctors" placeholder="Search doctors..." style="padding: 6px 10px; font-size: 14px;">
                </div>
            </header>


            <div class="content-section">
                <div class="table-container">
                    <table id="doctorsTable">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Unique ID</th>
                                <th>Name</th>
                                <th>Specialty</th>
                                <th>Contact</th>
                                <th>Room</th>
                                <th>Fee</th>
                                <th>Schedule</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td colspan="9" class="loading">Loading doctors...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Doctor Modal -->
    <div id="doctorModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add Doctor</h2>
                <span class="close">&times;</span>
            </div>
            <form id="doctorForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="doctorUniqueId">Unique ID</label>
                        <input type="text" id="doctorUniqueId" name="unique_id">
                    </div>
                    <div class="form-group">
                        <label for="doctorName">Name *</label>
                        <input type="text" id="doctorName" name="name" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="doctorSpecialty">Specialty *</label>
                        <input type="text" id="doctorSpecialty" name="specialty" required>
                    </div>
                    <div class="form-group">
                        <label for="doctorContact">Contact *</label>
                        <input type="tel" id="doctorContact" name="contact" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="doctorRoomNumber">Room Number</label>
                        <input type="text" id="doctorRoomNumber" name="room_number">
                    </div>
                    <div class="form-group">
                        <label for="doctorVisitFee">Visit Fee</label>
                        <input type="number" id="doctorVisitFee" name="visit_fee" step="0.01">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="doctorScheduleDays">Days *</label>
                        <select id="doctorScheduleDays" name="schedule_days" required>
                            <option value="Sat-Thu">Sat-Thu</option>
                            <option value="Mon-Fri">Mon-Fri</option>
                            <option value="Everyday">Everyday</option>
                            <option value="Sat-Wed">Sat-Wed</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="doctorStartTime">Start Time *</label>
                        <input type="time" id="doctorStartTime" name="start_time" required>
                    </div>
                    <div class="form-group">
                        <label for="doctorEndTime">End Time *</label>
                        <input type="time" id="doctorEndTime" name="end_time" required>
                    </div>
                </div>
                
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Doctor</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="scripts.js"></script>
    <script>
 let currentDoctorId = null;
    let doctors = [];

    async function loadDoctors() {
        try {
            const response = await fetch('/api/doctors');
            const data = await response.json();

            if (response.ok) {
                doctors = data;
                displayDoctors(doctors);
            } else {
                showToast('Failed to load doctors', 'error');
            }
        } catch (error) {
            showToast('Network error loading doctors', 'error');
        }
    }

    function displayDoctors(doctorsData) {
        const tbody = document.querySelector('#doctorsTable tbody');
        tbody.innerHTML = '';

        if (doctorsData.length === 0) {
            tbody.innerHTML = '<tr><td colspan="9" class="no-data">No doctors found</td></tr>';
            return;
        }

        doctorsData.forEach(doctor => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${doctor.id}</td>
                <td>${doctor.unique_id || '-'}</td>
                <td>${doctor.name}</td>
                <td>${doctor.specialty}</td>
                <td>${doctor.contact}</td>
                <td>${doctor.room_number || '-'}</td>
                <td>${doctor.visit_fee || '0'}</td>
                <td>${doctor.schedule || 'Not specified'}</td>
                <td>
                    <button class="btn btn-sm btn-secondary" onclick="editDoctor(${doctor.id})">Edit</button>
                    <button class="btn btn-sm btn-danger" onclick="deleteDoctor(${doctor.id})">Delete</button>
                </td>
            `;
            tbody.appendChild(row);
        });
    }


    document.addEventListener('DOMContentLoaded', () => {
        checkAuthAndLoadUser();
        loadDoctors();

        // Search input event to filter doctors list
        document.getElementById('searchDoctors').addEventListener('input', function () {
            const searchTerm = this.value.toLowerCase();

            const filteredDoctors = doctors.filter(doc =>
                doc.name.toLowerCase().includes(searchTerm) ||
                (doc.specialty && doc.specialty.toLowerCase().includes(searchTerm)) ||
                (doc.contact && doc.contact.toLowerCase().includes(searchTerm)) ||
                (doc.schedule && doc.schedule.toLowerCase().includes(searchTerm))
            );

            displayDoctors(filteredDoctors);
        });

        // Modal close
        document.querySelector('.close').addEventListener('click', () => {
            document.getElementById('doctorModal').style.display = 'none';
        });

        // Cancel button
        document.getElementById('cancelBtn').addEventListener('click', () => {
            document.getElementById('doctorModal').style.display = 'none';
        });

        // Form submit
        document.getElementById('doctorForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const doctorData = Object.fromEntries(formData);
            
            const formatTime12 = (time24) => {
                if (!time24) return '';
                const [hStr, mStr] = time24.split(':');
                let h = parseInt(hStr, 10);
                const ampm = h >= 12 ? 'PM' : 'AM';
                h = h % 12;
                if (h === 0) h = 12;
                return `${String(h).padStart(2, '0')}:${mStr} ${ampm}`;
            };
            
            const daysVal = document.getElementById('doctorScheduleDays').value;
            const startTimeVal = document.getElementById('doctorStartTime').value;
            const endTimeVal = document.getElementById('doctorEndTime').value;
            
            const start12 = formatTime12(startTimeVal);
            const end12 = formatTime12(endTimeVal);
            
            doctorData.schedule = `${daysVal}: ${start12} - ${end12}`;
            
            delete doctorData.schedule_days;
            delete doctorData.start_time;
            delete doctorData.end_time;
            
            saveDoctor(doctorData);
        });

        // Close modal on clicking outside
        window.addEventListener('click', (e) => {
            if (e.target === document.getElementById('doctorModal')) {
                document.getElementById('doctorModal').style.display = 'none';
            }
        });
    });



        // Edit doctor
        function editDoctor(id) {
            const doctor = doctors.find(d => d.id === id);
            if (!doctor) return;
            
            currentDoctorId = id;
            document.getElementById('modalTitle').textContent = 'Edit Doctor';
            document.getElementById('doctorUniqueId').value = doctor.unique_id || '';
            document.getElementById('doctorName').value = doctor.name;
            document.getElementById('doctorSpecialty').value = doctor.specialty;
            document.getElementById('doctorContact').value = doctor.contact;
            document.getElementById('doctorRoomNumber').value = doctor.room_number || '';
            document.getElementById('doctorVisitFee').value = doctor.visit_fee || '';
            
            let days = 'Everyday';
            let startTime24 = '09:00';
            let endTime24 = '17:00';
            
            if (doctor.schedule) {
                const parts = doctor.schedule.split(':');
                if (parts.length > 1) {
                    days = parts[0].trim();
                }
                
                const timePart = parts.slice(1).join(':') || parts[0];
                const regex = /(\d+(?::\d+)?)\s*(AM|PM|P\.M|A\.M)?/gi;
                const matches = [];
                let match;
                let cleanTimePart = timePart.replace(/(\d+[\.:])[oO]{2}/g, '$100')
                                             .replace(/(\d+[\.:])[oO]/g, '$10')
                                             .replace(/\./g, ':');
                
                while ((match = regex.exec(cleanTimePart)) !== null) {
                    matches.push({
                        time: match[1],
                        ampm: match[2] ? match[2].replace(/\./g, '').toUpperCase() : null
                    });
                }
                
                if (matches.length >= 2) {
                    let startMatch = matches[0];
                    let endMatch = matches[1];
                    
                    if (!startMatch.ampm && endMatch.ampm) {
                        const startVal = parseFloat(startMatch.time.replace(':', '.'));
                        const endVal = parseFloat(endMatch.time.replace(':', '.'));
                        startMatch.ampm = (endMatch.ampm === 'PM' && startVal < endVal) ? 'PM' : 'AM';
                    }
                    if (!startMatch.ampm) startMatch.ampm = 'AM';
                    if (!endMatch.ampm) endMatch.ampm = 'PM';
                    
                    const convertTo24 = (timeStr, ampm) => {
                        const tParts = timeStr.split(':');
                        let h = parseInt(tParts[0], 10);
                        const m = tParts.length > 1 ? parseInt(tParts[1], 10) : 0;
                        if (ampm === 'PM' && h < 12) h += 12;
                        if (ampm === 'AM' && h === 12) h = 0;
                        return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
                    };
                    
                    startTime24 = convertTo24(startMatch.time, startMatch.ampm);
                    endTime24 = convertTo24(endMatch.time, endMatch.ampm);
                }
            }
            
            document.getElementById('doctorScheduleDays').value = days;
            document.getElementById('doctorStartTime').value = startTime24;
            document.getElementById('doctorEndTime').value = endTime24;
            
            document.getElementById('doctorModal').style.display = 'block';
        }

        // Delete doctor
        async function deleteDoctor(id) {
            if (!confirm('Are you sure you want to delete this doctor?')) return;
            
            try {
                const response = await fetch(`/api/doctors/${id}`, {
                    method: 'DELETE'
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showToast('Doctor deleted successfully', 'success');
                    loadDoctors();
                } else {
                    showToast(data.error || 'Failed to delete doctor', 'error');
                }
            } catch (error) {
                showToast('Network error deleting doctor', 'error');
            }
        }

        // Save doctor
        async function saveDoctor(formData) {
            const url = currentDoctorId ? `/api/doctors/${currentDoctorId}` : '/api/doctors';
            const method = currentDoctorId ? 'PUT' : 'POST';
            
            try {
                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showToast(currentDoctorId ? 'Doctor updated successfully' : 'Doctor added successfully', 'success');
                    document.getElementById('doctorModal').style.display = 'none';
                    loadDoctors();
                } else {
                    showToast(data.error || 'Failed to save doctor', 'error');
                }
            } catch (error) {
                showToast('Network error saving doctor', 'error');
            }
        }

    </script>
</body>
</html>
