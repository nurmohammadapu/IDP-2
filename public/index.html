<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnostic Center Management System - Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>🔬 Diagnostic Center Management System</h1>
                <p>Please sign in to continue</p>
            </div>
            
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="email">Email Address or Phone Number</label>
                    <input type="text" id="email" name="email" placeholder="Email or Phone Number (e.g. 017xxxxxxxx)" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                
                <button type="submit" class="btn btn-primary">Sign In</button>
            </form>

            <div class="auth-footer" style="text-align: center; margin-top: 1.5rem; padding-top: 1.2rem; border-top: 1px solid #e2e8f0;">
                <p style="color: #64748b; font-size: 0.9rem; margin: 0;">Don't have an account? <a href="register.html" style="color: #4f46e5; text-decoration: none; font-weight: 600;">Register Here</a></p>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        // Login functionality
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showToast('Login successful! Redirecting...', 'success');
                    setTimeout(() => {
                        const role = data.user.role;
                        if (role === 'admin') {
                            window.location.href = '/dashboard.html';
                        } else if (role === 'doctor') {
                            window.location.href = '/doctor-dashboard.html';
                        } else if (role === 'patient') {
                            window.location.href = '/patient-dashboard.html';
                        } else if (role === 'receptionist') {
                            window.location.href = '/receptionist-dashboard.html';
                        } else if (role === 'accountant') {
                            window.location.href = '/dashboard.html';
                        } else {
                            window.location.href = '/dashboard.html';
                        }
                    }, 1000);
                } else {
                    showToast(data.error || 'Login failed', 'error');
                }
            } catch (error) {
                showToast('Network error. Please try again.', 'error');
            }
        });

        // Toast notification function
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast toast-${type} show`;
            
            setTimeout(() => {
                toast.className = 'toast';
            }, 3000);
        }

        // Check if already logged in
        async function checkAuth() {
            try {
                const response = await fetch('/api/auth/me');
                if (response.ok) {
                    const data = await response.json();
                    const role = data.user.role;
                    if (role === 'admin') {
                        window.location.href = '/dashboard.html';
                    } else if (role === 'doctor') {
                        window.location.href = '/doctor-dashboard.html';
                    } else if (role === 'patient') {
                        window.location.href = '/patient-dashboard.html';
                    } else if (role === 'receptionist') {
                        window.location.href = '/receptionist-dashboard.html';
                    } else if (role === 'accountant') {
                        window.location.href = '/dashboard.html';
                    } else {
                        window.location.href = '/dashboard.html';
                    }
                }
            } catch (error) {
                // User not logged in, stay on login page
            }
        }

        checkAuth();
    </script>
</body>
</html>
